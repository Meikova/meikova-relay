name: Multi-Platform Workstation Build & Release CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'LICENSE'
      - '.gitignore'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.54) - Leave empty for build & test only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. WINDOWS BUILD JOB
  # ==========================================
  build-windows:
    name: Build Windows Host (.exe & .zip)
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        contains(github.event.head_commit.message, '[build]') ||
        contains(github.event.head_commit.message, '[release]') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r host_agent/requirements.txt
          pip install pyinstaller pywebview

      - name: Set up Node.js for Relay Tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Relay Server Dependencies
        run: |
          cd relay-server
          npm install

      - name: Run Test Suite
        timeout-minutes: 5
        run: |
          python -m unittest discover tests

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Standalone Windows Executable & Package
        run: |
          python scripts/build.py --target windows

      - name: Verify Windows Artifacts
        run: |
          if (-not (Test-Path "dist\MeikovaRelayHost.exe")) {
            Write-Error "dist\MeikovaRelayHost.exe was not created."
            exit 1
          }
          if (-not (Test-Path "dist\MeikovaRelayHost-windows-x64.zip")) {
            Write-Error "dist\MeikovaRelayHost-windows-x64.zip was not created."
            exit 1
          }
          if (-not (Test-Path "dist\MeikovaRelayHost-Setup.exe")) {
            Write-Error "dist\MeikovaRelayHost-Setup.exe was not created."
            exit 1
          }
          Get-ChildItem "dist\*" | Select-Object Name, Length

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meikova-relay-host-windows
          path: |
            dist/MeikovaRelayHost.exe
            dist/MeikovaRelayHost-Setup.exe
            dist/MeikovaRelayHost-windows-x64.zip
            dist/SHA256SUMS.txt

      - name: Resolve Release Tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            VER=$(node -p "require('./relay-server/package.json').version")
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish Windows Release Assets
        if: |
          startsWith(github.ref, 'refs/tags/v') ||
          contains(github.event.head_commit.message, '[release]') ||
          github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            dist/MeikovaRelayHost.exe
            dist/MeikovaRelayHost-Setup.exe
            dist/MeikovaRelayHost-windows-x64.zip
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true

  # ==========================================
  # 2. LINUX BUILD JOB (.deb & .tar.gz)
  # ==========================================
  build-linux:
    name: Build Linux Host (ELF, .deb & .tar.gz)
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        contains(github.event.head_commit.message, '[build]') ||
        contains(github.event.head_commit.message, '[release]') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libpng-dev python3-tk xvfb libturbojpeg0-dev

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r host_agent/requirements.txt
          pip install pyinstaller

      - name: Set up Node.js for Relay Tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Relay Server Dependencies
        run: |
          cd relay-server
          npm install

      - name: Run Test Suite
        timeout-minutes: 5
        run: |
          xvfb-run -a python -m unittest discover tests

      - name: Build Linux Standalone Binary, Debian Package & Tarball
        run: |
          python scripts/build.py --target linux

      - name: Verify Linux Artifacts
        run: |
          test -f dist/meikova-relay-host || (echo "Binary not found" && exit 1)
          test -f dist/meikova-relay-host_amd64.deb || (echo "DEB package not found" && exit 1)
          test -f dist/meikova-relay-host-linux-x64.tar.gz || (echo "Tarball not found" && exit 1)
          ls -lh dist/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meikova-relay-host-linux
          path: |
            dist/meikova-relay-host
            dist/meikova-relay-host_amd64.deb
            dist/meikova-relay-host-linux-x64.tar.gz

      - name: Resolve Release Tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            VER=$(node -p "require('./relay-server/package.json').version")
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish Linux Release Assets
        if: |
          startsWith(github.ref, 'refs/tags/v') ||
          contains(github.event.head_commit.message, '[release]') ||
          github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            dist/meikova-relay-host
            dist/meikova-relay-host_amd64.deb
            dist/meikova-relay-host-linux-x64.tar.gz
          draft: false
          prerelease: false

  # ==========================================
  # 3. MACOS BUILD JOB (.app, .dmg & .tar.gz)
  # ==========================================
  build-macos:
    name: Build macOS Host (.app & .tar.gz)
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[ci skip]') &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        contains(github.event.head_commit.message, '[build]') ||
        contains(github.event.head_commit.message, '[release]') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (macOS)
        run: |
          brew install jpeg-turbo || true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r host_agent/requirements.txt
          pip install pyinstaller

      - name: Set up Node.js for Relay Tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Relay Server Dependencies
        run: |
          cd relay-server
          npm install

      - name: Run Test Suite
        timeout-minutes: 5
        run: |
          python -m unittest discover tests

      - name: Build macOS Binary & Packages
        run: |
          python scripts/build.py --target macos

      - name: Verify macOS Artifacts
        run: |
          test -f dist/MeikovaRelayHost || (echo "macOS binary not found" && exit 1)
          test -f dist/meikova-relay-host-macos.tar.gz || (echo "macOS tarball not found" && exit 1)
          ls -lh dist/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meikova-relay-host-macos
          path: |
            dist/MeikovaRelayHost
            dist/meikova-relay-host-macos.tar.gz

      - name: Resolve Release Tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            VER=$(node -p "require('./relay-server/package.json').version")
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish macOS Release Assets
        if: |
          startsWith(github.ref, 'refs/tags/v') ||
          contains(github.event.head_commit.message, '[release]') ||
          github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            dist/MeikovaRelayHost
            dist/meikova-relay-host-macos.tar.gz
          draft: false
          prerelease: false
