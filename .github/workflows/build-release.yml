name: Multi-Platform Workstation Build & Release CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. WINDOWS BUILD JOB
  # ==========================================
  build-windows:
    name: Build Windows Host (.exe & .zip)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r host_agent/requirements.txt
          pip install pyinstaller

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

      - name: Build Standalone Windows Executable & Package
        run: |
          python scripts/build.py --target windows

      - name: Verify Windows Artifacts
        run: |
          if (-not (Test-Path "dist\TitanRemoteHost.exe")) {
            Write-Error "dist\TitanRemoteHost.exe was not created."
            exit 1
          }
          if (-not (Test-Path "dist\TitanRemoteHost-windows-x64.zip")) {
            Write-Error "dist\TitanRemoteHost-windows-x64.zip was not created."
            exit 1
          }
          Get-ChildItem "dist\*" | Select-Object Name, Length

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TitanRemoteHost-Windows
          path: |
            dist/TitanRemoteHost.exe
            dist/TitanRemoteHost-windows-x64.zip

  # ==========================================
  # 2. LINUX BUILD JOB (.deb & .tar.gz)
  # ==========================================
  build-linux:
    name: Build Linux Host (ELF, .deb & .tar.gz)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libpng-dev python3-tk

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r host_agent/requirements.txt
          pip install pyinstaller

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

      - name: Build Linux Standalone Binary, Debian Package & Tarball
        run: |
          python scripts/build.py --target linux

      - name: Verify Linux Artifacts
        run: |
          test -f dist/titan-remote-host || (echo "Binary not found" && exit 1)
          test -f dist/titan-remote-host_amd64.deb || (echo "DEB package not found" && exit 1)
          test -f dist/titan-remote-host-linux-x64.tar.gz || (echo "Tarball not found" && exit 1)
          ls -lh dist/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TitanRemoteHost-Linux
          path: |
            dist/titan-remote-host
            dist/titan-remote-host_amd64.deb
            dist/titan-remote-host-linux-x64.tar.gz

  # ==========================================
  # 3. MACOS BUILD JOB (.app, .dmg & .tar.gz)
  # ==========================================
  build-macos:
    name: Build macOS Host (.app & .tar.gz)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r host_agent/requirements.txt
          pip install pyinstaller

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

      - name: Build macOS Binary & Packages
        run: |
          python scripts/build.py --target macos

      - name: Verify macOS Artifacts
        run: |
          test -f dist/TitanRemoteHost || (echo "macOS binary not found" && exit 1)
          test -f dist/titan-remote-host-macos.tar.gz || (echo "macOS tarball not found" && exit 1)
          ls -lh dist/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TitanRemoteHost-macOS
          path: |
            dist/TitanRemoteHost
            dist/titan-remote-host-macos.tar.gz
            dist/*.dmg

  # ==========================================
  # 4. UNIFIED RELEASE JOB
  # ==========================================
  release:
    name: Publish Multi-Platform Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Create Release Directory
        run: mkdir -p release_artifacts

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: TitanRemoteHost-Windows
          path: release_artifacts/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: TitanRemoteHost-Linux
          path: release_artifacts/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: TitanRemoteHost-macOS
          path: release_artifacts/

      - name: Generate Consolidated Checksums
        run: |
          cd release_artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
