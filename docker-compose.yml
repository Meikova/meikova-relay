services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meikova-relay
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
      - HOST=0.0.0.0
      - AUTO_TUNNEL=${AUTO_TUNNEL:-0}
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
      - TUNNEL_HOSTNAME=${TUNNEL_HOSTNAME:-}
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
      - DATA_DIR=/app/relay-server/data
    volumes:
      - ./data:/app/relay-server/data
      - ./relay-server/public:/app/relay-server/public
      - ./relay-server/server.js:/app/relay-server/server.js
      - ./relay-server/tunnel_manager.js:/app/relay-server/tunnel_manager.js
      - ./web-client:/app/web-client
      - ./dist:/app/dist
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/tunnel/status"]
      interval: 30s
      timeout: 5s
      retries: 3
