services:
  - type: web
    name: meikova-relay
    runtime: node
    rootDir: relay-server
    buildCommand: npm install
    startCommand: node --experimental-sqlite server.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_OPTIONS
        value: --experimental-sqlite
