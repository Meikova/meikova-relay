<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#05070C"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Chamber -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#22C55E" stroke-opacity="0.3" stroke-width="1"/>
  
  <!-- Ambient Infinity Symbol (Titan Remote Engine) -->
  <path d="M32 32 C 40 20, 54 20, 54 32 C 54 44, 40 44, 32 32 C 24 20, 10 20, 10 32 C 10 44, 24 44, 32 32 Z" 
        fill="none" 
        stroke="#22C55E" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>
  
  <!-- Core Phosphor Pulse Dot -->
  <circle cx="32" cy="32" r="3.2" fill="#FFFFFF" filter="url(#neonGlow)"/>
</svg>
